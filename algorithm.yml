algorithm_name: esa_biomass_dps
algorithm_version: cleanup
algorithm_description: MAAP OGC Application Package that queries ESA BIOMASS
  Level 1B data within a user-defined bounding box and time range, retrieves
  GeoTIFF assets, loads the selected area through STAC/ODC, forward-fills the
  latest available time slice, and writes the result as a Cloud Optimized
  GeoTIFF (COG).
code_repository: https://github.com/MAAP-Project/esa-biomass-dps
run_command: esa-biomass-dps/run.sh
build_command: esa-biomass-dps/build.sh
ram_min: 8
cores_min: 4
base_container_url: mas.dit.maap-project.org/root/maap-workspaces/custom_images/maap_base:develop
inputs:
  - name: bbox
    label: Bounding box
    doc: Comma-separated bounding box coordinates as min_x,min_y,max_x,max_y
      in the CRS supplied by `crs`
    type: string
  - name: crs
    label: CRS
    doc: Coordinate reference system for the bounding box and output raster,
      for example `EPSG:4326`
    type: string
  - name: datetime
    label: Datetime range
    doc: Datetime range for the ESA BIOMASS STAC query, formatted as an ISO
      8601 interval such as
      `2026-01-01T00:00:00Z/2026-01-31T23:59:59Z`
    type: string
  - name: resolution
    label: Output resolution
    doc: Output resolution in CRS units
    type: double
    default: 0.01
outputs:
  - name: out
    type: Directory
outdir_max: 20
